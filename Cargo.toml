[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/services",
    "crates/frontend",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Real Estate Manager"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "1"
